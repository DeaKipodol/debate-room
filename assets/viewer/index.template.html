<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>토론방</title><style>/*STYLE*/</style></head>
<body>
<div class="shell">
<aside class="sidebar"><a class="brand" href="#">토론방<span class="brand-dot"></span></a><p class="side-caption">질문에서 다음 판단까지</p><div class="side-heading">토론 <button id="newTopic" class="icon" aria-label="새 토론 만들기" title="새 토론">＋</button></div><nav id="topics" aria-label="토론 목록"></nav><div class="side-heading people-heading">참여자 <button id="clearFilter" class="text-button">전체</button></div><div id="people"></div><div class="side-bottom"><a class="text-button" href="map-demo.html" target="_blank">↗ 상단 지도 시안 만져보기</a><button id="references" class="text-button">↗ 참고 자료 모음</button><span>원문을 보존하는 토론 기록</span></div></aside>
<main><header class="topbar"><div><span class="eyebrow">토론 기록</span><h1 id="topicTitle"></h1></div><div class="toolbar"><span id="connection" class="connection">기록 보기</span><button id="replay" class="icon" aria-label="기록 순서대로 재생" title="기록 재생">▷</button><button id="export" class="icon" aria-label="전체 기록 내보내기" title="내보내기">↓</button><button id="import" class="primary">대화 넣기 <span>＋</span></button></div></header>
<div id="context" class="topic-context"></div><div id="feedErrors" class="notice error" hidden></div><div id="filterStatus" class="filter-status" hidden></div>
<section id="timeline" class="timeline" aria-label="토론 발화"></section>
<button id="newMessages" class="new-messages" hidden>새 발화 보기 ↓</button><footer><span id="count"></span><span>발화의 출처와 답변 관계를 함께 남깁니다.</span></footer></main>
</div>
<dialog id="inputDialog"><form method="dialog" class="dialog-head"><h2>대화 넣기</h2><button class="icon" aria-label="닫기">×</button></form><p>진행한 대화를 붙여 넣거나, 에이전트의 발화 파일을 가져오세요.</p><div class="input-tabs"><button id="textTab" aria-pressed="true">대화 붙여넣기</button><button id="jsonTab" aria-pressed="false">발화 파일 · JSON</button></div><label id="inputLabel" for="inputText">[토론: 제목]과 [발언자]로 나누어 적어 주세요.</label><textarea id="inputText" spellcheck="false" placeholder="[토론: 상단 지도]&#10;[MC]&#10;현재 위치로 어떻게 돌아오면 좋을까요?&#10;[지도 담당]&#10;현재 위치 버튼을 지도 안에 두면 좋겠습니다."></textarea><div class="file-row"><label class="file-label">파일 고르기<input id="fileInput" type="file" accept=".json,.txt,.md"></label><button id="example" class="text-button">형식 예시 넣기</button></div><div id="inputPreview" class="input-preview" aria-live="polite">미리보기 후 추가할 수 있습니다.</div><div class="dialog-actions"><button id="preview" class="secondary">미리보기</button><button id="add" class="primary" disabled>기록에 추가</button></div></dialog>
<dialog id="topicDialog"><form method="dialog" class="dialog-head"><h2>새 토론</h2><button class="icon" aria-label="닫기">×</button></form><label for="topicName">무엇을 이야기하나요?</label><input id="topicName" placeholder="토론 제목"><label for="topicPurpose">어떤 판단을 얻으려 하나요?</label><textarea id="topicPurpose" rows="3" placeholder="토론의 목적과 시작 이유"></textarea><div id="topicError" class="error" aria-live="polite"></div><button id="createTopic" class="primary">빈 토론 열기</button></dialog>
<dialog id="refsDialog" class="refs-dialog"><form method="dialog" class="dialog-head"><h2>토론의 참고 자료</h2><button class="icon" aria-label="닫기">×</button></form><p>이번 토론에 사용하는 근거 자료를 확인합니다.</p><div id="refList"></div></dialog>
<div id="toast" role="status"></div>
<script type="application/json" id="initialData">/*SEED*/</script><script type="application/json" id="referenceData">/*REFS*/</script>
<script>/*MODEL*/</script><script>/*APP*/</script>
</body></html>
